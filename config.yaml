project:
  app_name: "Contrarian 10-Bagger Engine"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  watchlists_dir: "outputs/watchlists"
  reports_dir: "outputs/reports"
  log_file: "outputs/reports/engine.log"
  universe_output: "data/processed/universe.csv"
  sec_filings_output: "data/processed/sec_filings.csv"
  sec_flags_output: "data/processed/sec_filing_flags.csv"
  sec_signals_output: "data/processed/sec_filing_signals.csv"
  event_shocks_output: "data/processed/event_shocks.csv"
  fundamentals_output: "data/processed/fundamentals_stub.csv"
  price_history_features_output: "data/processed/price_history_features.csv"
  research_batch_output: "data/processed/research_batch.csv"
  source_status_output: "data/processed/source_status.csv"
  theory_scores_output: "data/processed/theory_scores.csv"
  ranked_watchlist_output: "outputs/watchlists/repricing_sequence_watchlist.csv"

universe:
  source_priority:
    - "seed_csv"
    - "nasdaq_screener"
    - "sec_company_names"
    - "yahoo_quote"
    - "stooq_daily"
  seed_csv: "data/raw/seed_universe.csv"
  use_nasdaq_screener: true
  nasdaq_screener_url: "https://api.nasdaq.com/api/screener/stocks"
  nasdaq_exchanges:
    - "nasdaq"
    - "nyse"
    - "amex"
  metadata_csv: "data/raw/ticker_metadata.csv"
  tickers:
    - JOB
    - RAVE
    - ELTK
    - USEG
    - LCTX
    - OPTT
    - WATT
    - HYSR
    - AQMS
    - CLIR
