    - XELA
    - ZOM
  filters:
    max_price: 20.0
    min_avg_volume: 100000
    min_dollar_volume: 50000
    max_market_cap: 1000000000
    include_otc: false
  illiquidity:
    flag_below_avg_volume: 100000
    flag_below_dollar_volume: 50000
    keep_illiquid: true
  quote_batch_size: 80
  use_yahoo_quotes: true
  max_stooq_fallback_tickers: 0
  stooq_fallback_timeout_seconds: 6

refresh:
  use_network: true
  request_timeout_seconds: 20
  retry_count: 2
  cache_ttl_hours: 6

research_batch:
  size: 250
  focus: "10_bagger_candidates"
  require_core_data_when_possible: true
  price_band_minimums:
    under_1: 75
    between_1_and_5: 70
    between_5_and_20: 55

prices:
  enabled: true
  provider: "yahoo_chart"
  fallback_providers:
    - "stooq"
  history_days: 260
  fetch_max_history: true
  yahoo_history_range: "max"
  max_tickers_per_run: 250
  history_timeout_seconds: 6
  selection_strategy: "prioritized"
  min_rows_for_features: 30

sec:
  enabled: true
  user_agent_env: "SEC_USER_AGENT"
  default_user_agent: "ContrarianFlowEngine research@example.com"
  company_tickers_url: "https://www.sec.gov/files/company_tickers.json"
  submissions_url: "https://data.sec.gov/submissions/CIK{cik}.json"
  companyfacts_url: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
  max_recent_filings_per_ticker: 80
  max_tickers_per_run: 250
  high_signal_forms:
    - "10-K"
    - "10-Q"
    - "8-K"
    - "S-1"
    - "F-1"
    - "F-1/A"
    - "S-3"
    - "F-3"
    - "F-3/A"
    - "424B"
    - "424B1"
    - "424B2"
    - "424B3"
    - "424B4"
    - "424B5"
  recent_activity_days: 45
  activity_spike_days: 14
  financing_lookback_days: 365
  never_block_pipeline: true

event_shocks:
  enabled: true
  max_detail_tickers: 250
  max_8k_documents_per_ticker: 4
  scan_exhibits: true
  max_exhibit_documents_per_filing: 2
  detail_timeout_seconds: 4
  inspect_suspicious_outside_batch: false
  cache_ttl_hours: 24
  metadata_only_penalty: 0
  routine_detail_penalty: 0
  callout_only_detail_labels:
    - "major_financing_or_warrants"
    - "restructuring_or_workforce"
    - "asset_sale_or_impairment"
    - "business_pivot_or_rebrand"

fundamentals:
  enabled: true
  provider: "sec_companyfacts"
  max_tickers_per_run: 250

scoring:
  enabled: true
  zombie_decay:
    enabled: true
    age_start_years: 3
    age_full_years: 10
    max_penalty: 18
    dynamism_offset_strength: 0.12
    high_dynamism_threshold: 65
  event_overrides:
    CLGN:
      event_shock_penalty: 28
      thesis_break_risk_score: 85
      catalyst_probability_adjustment: -15
      note: "AbbVie/Allergan terminated the development agreement effective June 8, 2026; CollPlant announced roughly 50% workforce reduction and runway extension into Q4 2026. Treat as partner-loss reset, not ordinary filing activity."
  sequence_thresholds:
    austrian_high: 70
    hume_high: 55
    keynes_high: 70
  thresholds:
    high_score: 70
    low_price: 1.0
    very_low_market_cap: 50000000
    small_market_cap: 300000000
    ten_bagger_market_cap_ceiling: 1000000000
    high_dollar_volume: 1000000
    low_dollar_volume: 50000
    relative_mispricing_high: 65
    asymmetry_high: 65
