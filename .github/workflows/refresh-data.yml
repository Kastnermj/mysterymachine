name: Refresh Research Data

on:
  workflow_dispatch:
    inputs:
      refresh_note:
        description: "Optional note for this manual refresh"
        required: false
        default: "manual refresh"
  schedule:
    # Daily at 06:00 UTC, which is 1:00 AM Eastern Standard Time.
    # During daylight saving time this runs at 2:00 AM Eastern.
    - cron: "0 6 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: refresh-research-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh Top 250 research data
        run: python main.py

      - name: Force Streamlit redeploy marker
        run: |
          mkdir -p outputs/reports
          {
            echo "last_refresh_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_sha=${GITHUB_SHA}"
          } > outputs/reports/streamlit_redeploy_marker.txt

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed outputs/watchlists outputs/reports
          if git diff --cached --quiet; then
            echo "No refreshed data changes to commit."
          else
            git commit -m "Refresh Top 250 research data"
            git push
          fi
